name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

jobs:
  check:
    name: Check on ${{ matrix.os }}, Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  pull-request-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            build
            ci
            chore
          subjectPattern: ^[a-z](?!.*[;\u2013\u2014]).*[^.]$
          subjectPatternError: The summary is lowercase, has no final period, and uses no semicolons or dashes.

  # A job of the matrix that GitHub cancels before a runner takes it, such as when it has no macOS
  # runner free, does not show in the results of needs, so the gate reads every job of the run and
  # passes only when each one succeeded or was skipped.
  all-checks:
    name: All checks
    if: always()
    needs: [check, pull-request-title]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --jq '.jobs[] | select(.name != "All checks") | .name + ": " + (.conclusion // "unfinished")' > results.txt
          cat results.txt
          ! grep -v -E ": (success|skipped)$" results.txt
